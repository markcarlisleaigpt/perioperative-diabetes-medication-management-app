<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perioperative Diabetes Medication Management Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MISSION CONTROL — flight-console telemetry
   Deep navy, signal-amber actions, glowing status readouts,
   corner-bracketed panels, faint plotting grid.
   ============================================================ */
:root {
  --bg:#070B14; --bg-well:#050810;
  --surface:#0E1626; --surface-2:#131C30; --surface-3:#182338;
  --line:#1E2A44; --line-strong:#2C3D63;
  --text:#E6ECF7; --dim:#93A1BC; --dim2:#69778F;
  --accent:#FFB454; --accent-dim:rgba(255,180,84,.13); --accent-ink:#201200;
  --st-red:#FF5D5D; --st-green:#3DDC97; --st-amber:#FFB454; --st-cyan:#4FC3F7; --st-violet:#B388FF;
  --focus:#4FC3F7;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { color-scheme: dark; scroll-behavior:smooth; }
body {
  font-family:'Barlow', -apple-system, sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh;
  overflow-x:hidden; position:relative;
}
/* plotting grid + vignette */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(79,195,247,.06), transparent 60%),
    repeating-linear-gradient(0deg, rgba(79,195,247,.025) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, rgba(79,195,247,.025) 0 1px, transparent 1px 48px);
}
.container { max-width:680px; margin:0 auto; padding:16px; min-height:100vh; position:relative; z-index:1; }
@keyframes fadeInUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideDown { from{opacity:0} to{opacity:1} }
/* ===== HEADER — console masthead ===== */
.header-banner {
  background:linear-gradient(180deg, var(--surface-2), var(--surface));
  border:1px solid var(--line-strong);
  border-radius:2px; padding:26px 24px 22px; margin-bottom:18px;
  text-align:center; position:relative; animation:slideDown .4s ease-out;
}
.header-banner::before, .header-banner::after {
  content:''; position:absolute; width:14px; height:14px; pointer-events:none;
}
.header-banner::before { top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
.header-banner::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }
.clinic-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--dim); margin-bottom:10px; text-transform:uppercase; letter-spacing:.22em; }
.header-banner h1 { font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; margin-bottom:6px; letter-spacing:.02em; line-height:1.15; text-transform:uppercase; }
.header-banner p { font-size:13px; color:var(--dim); letter-spacing:.2px; }
.step-indicator { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--accent); margin-bottom:8px; font-weight:700; text-transform:uppercase; letter-spacing:.3em; text-shadow:0 0 12px rgba(255,180,84,.5); }
/* ===== CARDS — console panels ===== */
.card {
  background:var(--surface);
  border:1px solid var(--line); border-radius:2px; padding:22px; margin-bottom:14px;
  animation:fadeInUp .3s ease-out both; position:relative;
}
.card::before {
  content:''; position:absolute; top:-1px; left:-1px; width:10px; height:10px;
  border-top:2px solid var(--line-strong); border-left:2px solid var(--line-strong); pointer-events:none;
}
.question { font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700; margin-bottom:14px; letter-spacing:.03em; text-transform:uppercase; }
.section-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--dim); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.18em; }
.section-label::before { content:'// '; color:var(--dim2); }
.section-label:first-of-type { margin-top:0; }
.section-text { font-size:13.5px; line-height:1.7; color:#C3CCDE; margin-bottom:12px; }
/* ===== BUTTONS ===== */
button {
  display:block; width:100%; padding:13px 16px; margin-bottom:10px;
  font-size:14px; border:1px solid var(--line-strong); background:var(--surface-2);
  color:var(--text); border-radius:2px; cursor:pointer; text-align:left;
  transition:border-color .12s, background .12s, box-shadow .12s;
  font-family:'Barlow',sans-serif; font-weight:500;
}
button:hover { border-color:var(--accent); background:var(--surface-3); box-shadow:0 0 12px rgba(255,180,84,.12); }
button:active { transform:translateY(1px); }
.btn-primary {
  background:linear-gradient(180deg,#FFC06A,#F29A2E); border-color:#F29A2E; color:var(--accent-ink);
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; text-align:center; letter-spacing:.08em; text-transform:uppercase;
}
.btn-primary:hover { background:linear-gradient(180deg,#FFCC82,#FFA940); border-color:#FFA940; box-shadow:0 0 18px rgba(255,180,84,.35); }
.btn-back { background:transparent; border:1px solid var(--line); color:var(--dim); font-size:13px; padding:10px 14px; text-align:center; margin-bottom:12px; }
.btn-back:hover { border-color:var(--line-strong); color:var(--text); background:transparent; box-shadow:none; }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; }
.btn-row button { flex:1; }
.btn-sm { padding:10px 14px; font-size:13px; margin-bottom:8px; }
/* ===== FORM INPUTS ===== */
.field-group { margin-bottom:16px; }
.field-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--dim); text-transform:uppercase; letter-spacing:.16em; margin-bottom:6px; display:block; }
input[type="text"], input[type="date"], input[type="number"] {
  width:100%; padding:12px 14px; background:var(--bg-well); border:1px solid var(--line);
  border-radius:2px; color:var(--text); font-family:'Barlow',sans-serif; font-size:14px;
  transition:border-color .12s, box-shadow .12s;
}
input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus {
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim), 0 0 14px rgba(255,180,84,.15);
}
input[type="text"]::placeholder, input[type="number"]::placeholder { color:var(--dim2); }
input[type="number"] { -moz-appearance:textfield; }
input[type="number"]::-webkit-inner-spin-button { opacity:.5; }
/* ===== CHECKBOX + RADIO ===== */
.check-label {
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px; margin-bottom:8px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:2px;
  cursor:pointer; font-size:14px; transition:border-color .12s, background .12s, box-shadow .12s;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none;
}
.check-label:hover { border-color:var(--line-strong); background:var(--surface-3); }
.check-label.selected { border-color:var(--accent); background:var(--accent-dim); box-shadow:inset 0 0 0 1px var(--accent), 0 0 12px rgba(255,180,84,.12); }
.no-selection-flash .header-banner,
.no-selection-flash .card,
.no-selection-flash .result-card { animation:none !important; }
.no-selection-flash .check-label,
.no-selection-flash .custom-check,
.no-selection-flash .custom-radio,
.no-selection-flash .custom-radio::after,
.no-selection-flash .toggle-btn,
.no-selection-flash .tab { transition:none !important; }
.custom-check {
  width:19px; height:19px; border:1.5px solid var(--line-strong); border-radius:2px;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:transparent; background:var(--bg-well);
  transition:all .12s; margin-top:1px;
}
.check-label.selected .custom-check { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 0 8px rgba(255,180,84,.5); }
.custom-radio {
  width:19px; height:19px; border:1.5px solid var(--line-strong); border-radius:50%;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg-well); transition:all .12s; margin-top:1px;
}
.custom-radio::after { content:''; width:9px; height:9px; border-radius:50%; background:transparent; transition:background .12s, box-shadow .12s; }
.check-label.selected .custom-radio { border-color:var(--accent); }
.check-label.selected .custom-radio::after { background:var(--accent); box-shadow:0 0 8px rgba(255,180,84,.6); }
input[type="checkbox"], input[type="radio"] { width:16px; height:16px; cursor:pointer; flex-shrink:0; accent-color:var(--accent); margin-top:1px; }
.check-info { font-size:12px; color:var(--dim); margin-top:2px; }
/* ===== DRUG-CLASS READOUTS ===== */
.category-header {
  display:flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; color:var(--text);
  text-transform:uppercase; letter-spacing:.16em;
  padding:10px 0 6px; border-bottom:1px solid var(--line-strong); margin:16px 0 8px;
}
.category-header:first-of-type { margin-top:0; }
.cat-chip { width:9px; height:9px; border-radius:1px; flex-shrink:0; background:var(--dim2); box-shadow:0 0 8px currentColor; }
[data-cat="sglt2i"] .cat-chip { background:#4FC3F7; box-shadow:0 0 8px rgba(79,195,247,.7); }
[data-cat="glp1"] .cat-chip { background:#3DDC97; box-shadow:0 0 8px rgba(61,220,151,.7); }
[data-cat="tirzepatide"] .cat-chip { background:#35D0BA; box-shadow:0 0 8px rgba(53,208,186,.7); }
[data-cat="dpp4i"] .cat-chip { background:#FFD54F; box-shadow:0 0 8px rgba(255,213,79,.7); }
[data-cat="metformin"] .cat-chip { background:#C79A6B; box-shadow:0 0 8px rgba(199,154,107,.7); }
[data-cat="sulfonylurea"] .cat-chip { background:#FFB454; box-shadow:0 0 8px rgba(255,180,84,.7); }
[data-cat="meglitinide"] .cat-chip { background:#FF8A50; box-shadow:0 0 8px rgba(255,138,80,.7); }
[data-cat="tzd"] .cat-chip { background:#B388FF; box-shadow:0 0 8px rgba(179,136,255,.7); }
[data-cat="agi"] .cat-chip { background:#9CCC65; box-shadow:0 0 8px rgba(156,204,101,.7); }
[data-cat="basalInsulin"] .cat-chip { background:#7E9CC9; box-shadow:0 0 8px rgba(126,156,201,.7); }
[data-cat="bolusInsulin"] .cat-chip { background:#FF7A90; box-shadow:0 0 8px rgba(255,122,144,.7); }
[data-cat="premixedInsulin"] .cat-chip { background:#A78BDA; box-shadow:0 0 8px rgba(167,139,218,.7); }
[data-cat="insulinU500"] .cat-chip { background:#FF5D5D; box-shadow:0 0 8px rgba(255,93,93,.8); }
[data-cat="pump"] .cat-chip { background:#90A4AE; box-shadow:0 0 8px rgba(144,164,174,.7); }
.drug-indent { padding-left:8px; }
/* ===== SEARCH ===== */
.search-wrap { position:relative; margin-bottom:16px; }
.search-wrap input { padding-left:36px; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--dim2); display:flex; pointer-events:none; }
/* ===== TOGGLE ===== */
.toggle-row { display:flex; background:var(--bg-well); border:1px solid var(--line); border-radius:2px; padding:3px; margin-bottom:16px; gap:3px; }
.toggle-btn { flex:1; padding:9px; font-size:13px; font-weight:600; border:none; border-radius:1px; background:transparent; color:var(--dim); cursor:pointer; transition:all .12s; text-align:center; box-shadow:none; margin:0; }
.toggle-btn.active { background:var(--accent); color:var(--accent-ink); box-shadow:0 0 12px rgba(255,180,84,.35); }
/* ===== BADGES — status readouts ===== */
.badge {
  display:inline-flex; align-items:center; gap:7px;
  font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700;
  padding:5px 11px; border-radius:2px; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:10px; background:rgba(0,0,0,.3); border:1px solid var(--dim);
}
.badge::before { content:''; width:7px; height:7px; border-radius:1px; flex-shrink:0; background:currentColor; box-shadow:0 0 8px currentColor; }
.badge-hold { color:var(--st-red); border-color:rgba(255,93,93,.55); box-shadow:0 0 14px rgba(255,93,93,.22); }
.badge-continue { color:var(--st-green); border-color:rgba(61,220,151,.55); box-shadow:0 0 14px rgba(61,220,151,.22); }
.badge-modify { color:var(--st-amber); border-color:rgba(255,180,84,.55); box-shadow:0 0 14px rgba(255,180,84,.22); }
.badge-consider { color:var(--st-cyan); border-color:rgba(79,195,247,.55); box-shadow:0 0 14px rgba(79,195,247,.22); }
.badge-consult { color:var(--st-violet); border-color:rgba(179,136,255,.55); box-shadow:0 0 14px rgba(179,136,255,.22); }
/* ===== RESULT CARDS ===== */
.result-card {
  border:1px solid var(--line); border-radius:2px; margin-bottom:16px; background:var(--surface);
  overflow:hidden; animation:fadeInUp .35s ease-out both; position:relative;
}
.result-card:nth-child(2) { animation-delay:.05s; }
.result-card:nth-child(3) { animation-delay:.1s; }
.result-card:nth-child(4) { animation-delay:.15s; }
.result-card:nth-child(5) { animation-delay:.2s; }
.result-card:nth-child(6) { animation-delay:.25s; }
.result-card-header { background:var(--surface-2); border-bottom:1px solid var(--line-strong); padding:16px 18px; position:relative; }
.result-card-header::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--dim); }
.result-card:has(.badge-hold) .result-card-header::before { background:var(--st-red); box-shadow:0 0 10px rgba(255,93,93,.6); }
.result-card:has(.badge-continue) .result-card-header::before { background:var(--st-green); box-shadow:0 0 10px rgba(61,220,151,.6); }
.result-card:has(.badge-modify) .result-card-header::before { background:var(--st-amber); box-shadow:0 0 10px rgba(255,180,84,.6); }
.result-card:has(.badge-consider) .result-card-header::before { background:var(--st-cyan); box-shadow:0 0 10px rgba(79,195,247,.6); }
.result-card:has(.badge-consult) .result-card-header::before { background:var(--st-violet); box-shadow:0 0 10px rgba(179,136,255,.6); }
.result-card-header h3 { font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700; margin-bottom:3px; letter-spacing:.04em; text-transform:uppercase; }
.result-card-header .drug-list { font-size:12px; color:var(--dim); }
.result-card-body { padding:16px 18px; }
.result-section { margin-bottom:14px; }
.result-section:last-child { margin-bottom:0; }
.result-section-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--accent); text-transform:uppercase; letter-spacing:.16em; padding-bottom:5px; border-bottom:1px solid var(--line-strong); margin-bottom:7px; }
.result-section-label::before { content:'// '; color:var(--dim2); }
.result-section-text { font-size:13.5px; line-height:1.7; color:#C3CCDE; }
.evidence-strip {
  background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--st-cyan);
  border-radius:2px; padding:12px 14px; margin-top:12px;
  font-size:12px; line-height:1.6; color:var(--dim);
}
.evidence-strip strong { color:var(--st-cyan); }
.evidence-link { color:#7ED4FA; text-decoration:underline; text-underline-offset:2px; font-weight:600; }
.evidence-link:hover { color:#B5E6FC; }
@media print { .evidence-link { color:#00614C !important; } }
.mono-data { font-family:'JetBrains Mono',monospace; font-size:.9em; font-weight:500; color:#F2F5FB; background:rgba(230,236,247,.08); border-radius:2px; padding:0 2px; }
.evidence-num { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; color:var(--dim2); }
.evidence-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--st-cyan); text-transform:uppercase; letter-spacing:.16em; padding-bottom:5px; border-bottom:1px solid var(--line-strong); margin-bottom:7px; }
@media print { .mono-data { color:#111 !important; background:#EDEFF0 !important; } }
/* ===== FLAGS ===== */
.flag { border-radius:2px; padding:10px 12px 10px 14px; margin-bottom:8px; font-size:12.5px; line-height:1.6; border:1px solid var(--line); background:var(--surface-2); position:relative; }
.flag::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
.flag-label { font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; margin-bottom:3px; }
.flag-warn { color:#EFD3A8; } .flag-warn::before { background:var(--st-amber); box-shadow:0 0 8px rgba(255,180,84,.5); } .flag-warn .flag-label { color:var(--st-amber); }
.flag-info { color:#B5DCF2; } .flag-info::before { background:var(--st-cyan); box-shadow:0 0 8px rgba(79,195,247,.5); } .flag-info .flag-label { color:var(--st-cyan); }
.flag-alert { color:#F7B7B7; } .flag-alert::before { background:var(--st-red); box-shadow:0 0 8px rgba(255,93,93,.5); } .flag-alert .flag-label { color:var(--st-red); }
/* ===== DISCLAIMER ===== */
.disclaimer {
  background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--st-red);
  border-radius:2px; padding:14px 16px; margin-bottom:18px; font-size:12px; line-height:1.6; color:#C3CCDE;
}
.disclaimer strong { color:var(--st-red); }
/* ===== OUTPUT TABS ===== */
.tab-bar { display:flex; gap:8px; margin-bottom:16px; }
.tab { flex:1; padding:11px; font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line); border-radius:2px; background:var(--surface-2); color:var(--dim); cursor:pointer; text-align:center; transition:all .12s; }
.tab.active { background:var(--surface-3); border-color:var(--accent); color:var(--accent); box-shadow:0 0 12px rgba(255,180,84,.18); }
.tab-content { display:none; }
.tab-content.active { display:block; }
/* ===== PATIENT SHEET ===== */
.patient-sheet-header {
  background:var(--surface-2); border:1px solid var(--line-strong);
  border-radius:2px; padding:20px; margin-bottom:16px; text-align:center;
}
.patient-sheet-header h2 { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:21px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.03em; }
.patient-meta { font-size:13px; color:#C3CCDE; line-height:1.8; }
.patient-drug-card { border:1px solid var(--line); border-radius:2px; padding:16px; margin-bottom:14px; background:var(--surface); }
.patient-drug-name { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; margin-bottom:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; }
.patient-section { margin-bottom:12px; }
.patient-section-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--accent); text-transform:uppercase; letter-spacing:.16em; padding-bottom:5px; border-bottom:1px solid var(--line-strong); margin-bottom:7px; }
.patient-section-text { font-size:14px; line-height:1.75; color:#DDE4F0; }
.patient-dietary { background:var(--accent-dim); border:1px solid rgba(255,180,84,.35); border-radius:2px; padding:12px; margin-top:10px; }
.patient-dietary-label { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; color:var(--accent); text-transform:uppercase; letter-spacing:.16em; padding-bottom:5px; border-bottom:1px solid rgba(255,180,84,.35); margin-bottom:7px; }
.patient-footer { border:1px solid var(--line); border-radius:2px; padding:16px; margin-top:8px; font-size:12px; color:var(--dim); line-height:1.7; background:var(--surface); }
/* ===== DOSE INPUT ===== */
.dose-group { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.dose-group label { font-size:13px; color:#C3CCDE; flex:1; }
.dose-group input { width:80px; flex:none; }
.dose-group .units { font-size:12px; color:var(--dim2); flex:none; }
/* ===== MISC ===== */
.helper-text { font-size:12px; color:var(--dim2); line-height:1.5; margin-bottom:14px; }
.divider { border:none; border-top:1px solid var(--line); margin:16px 0; }
.selected-count { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); margin-bottom:12px; font-weight:700; letter-spacing:.08em; }
.no-meds-msg { font-size:13px; color:var(--dim2); text-align:center; padding:20px; }
/* ===== A11Y ===== */
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
}
/* ===== PRINT ===== */
.provenance { border:1px solid var(--line); border-left:2px solid var(--st-cyan); background:var(--surface-2); border-radius:2px; padding:10px 12px; margin-bottom:10px; font-size:12.5px; line-height:1.65; color:var(--dim1); }
.provenance > div { margin-bottom:5px; } .provenance > div:last-child { margin-bottom:0; }
.prov-key { display:inline-block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--st-cyan); margin-right:6px; }
.prov-override { color:#EFD3A8; } .prov-override .prov-key { color:var(--st-amber); }
.prov-dim { color:var(--dim2); font-size:11.5px; }
@media print {
  body { background:#fff !important; color:#111 !important; }
  body::before { display:none; }
  .container { max-width:100%; padding:0; }

  addResult(getPremixedInsulinResults(ctx, details, selected));
  addResult(getPumpResult(ctx, details, selected));
  addResult(getU500Result(selected));
  return results;
}

// APP CLASS
// ================================================================
class PerioperativeDMApp {
  constructor() {
    this.step = 'intro';
    this.outputTab = 'clinician';
    this.searchQuery = '';
    this.state = {
      patient: { firstName: '', lastName: '', dob: '', arrivalTime: '', surgeryDate: '' },
      context: { dmType: null, surgeryType: null, surgeryTiming: null, hasHF: null, hasCKD: null, arrivalTime: '', surgeryDate: '' },
      selected: new Set(),
      details: {
        sglt2iMode: 'SPAQI',
        a1cOver8: null,
        prolongedFasting: null,
        surgeryOver3h: null,
        sglt2iDoseTime: null,
        dkaHistory: null,
        ketoDiet: null,
        eGFR: '',
        contrastWithin48h: null,
        giSymptoms: null,
        glp1NpoCutoff: 'midnight',
        insulinDetails: {},
      },
    };
    this.render();
  }
  setState(step) { this.step = step; this.render(); }
  generateInstructions() {
    // The >12 h carbohydrate-fast question forces a hold in every branch, so it must
    // be answered rather than silently defaulting to no-trigger. Surgery >3 h and A1c
    // may be left blank; both default to no trigger by decision (2026-07-31).
    if (this.state.details.sglt2iMode === 'SPAQI' && hasAnySGLT2i(this.state.selected) && this.state.details.prolongedFasting === null) {
      alert('Answer the question about more than 12 hours without carbohydrate intake before generating instructions. It determines whether the SGLT2 inhibitor is held.');
      return;
    }
    // Dose time of day is what makes a stop DATE computable. Without it a held
    // patient falls back to interval-only wording, which is the failure mode that
    // made the explicit-date feature effectively dead.
    if (hasAnySGLT2i(this.state.selected) && !this.state.details.sglt2iDoseTime) {
      alert('Select when the patient takes their SGLT2 inhibitor (morning or evening) before generating instructions. It determines the last permissible dose date if the medication is held.');
      return;
    }
    // NPH dosing frequency must be chosen before generating (peak-related dosing differs).
    const basal = getSelectedDrugsByClass(this.state.selected, 'basalInsulin');
    for (const drug of basal) {
      if (drug.isNPH) {
        const f = (this.state.details.insulinDetails[drug.id] || {}).frequency;
        if (f !== 'once' && f !== 'twice') {
          alert(`Select a dosing frequency for ${drug.name} before continuing.`);
          return;
        }
      }
    }
    this.setState('output');
  }
  setOutputTab(tab) { this.outputTab = tab; this.render({ quiet: true }); }
  updatePatient(key, val) { this.state.patient[key] = val; }
  updateContext(key, val) { this.state.context[key] = val; this.render({ quiet: true }); }
  updateDetails(key, val) { this.state.details[key] = val; this.render({ quiet: true }); }
  // No-render variants: used by free-text/number inputs so typing does not rebuild
  // the DOM mid-keystroke (which previously dropped focus and forced a re-tap per digit).
  updateDetailsNoRender(key, val) { this.state.details[key] = val; }
  updateInsulinDetail(drugId, key, val) {
    if (!this.state.details.insulinDetails[drugId]) this.state.details.insulinDetails[drugId] = {};
    this.state.details.insulinDetails[drugId][key] = val;
    this.render({ quiet: true });
  }
  updateInsulinDetailNoRender(drugId, key, val) {
    if (!this.state.details.insulinDetails[drugId]) this.state.details.insulinDetails[drugId] = {};
    this.state.details.insulinDetails[drugId][key] = val;
  }
  toggleDrug(drugId) {
    if (this.state.selected.has(drugId)) this.state.selected.delete(drugId);
    else this.state.selected.add(drugId);
    this.render({ quiet: true });
  }
  goBack() {
    const steps = ['intro','patient','context','medications','details','output'];
    const idx = steps.indexOf(this.step);
    if (idx > 0) {
      let prev = steps[idx - 1];
      if (prev === 'details' && !needsDetails(this.state.selected)) prev = 'medications';
      this.setState(prev);
    }
  }
  renderHeader(title, sub, step) {
    return `
      <div class="header-banner">
        <div class="clinic-label">ABSMC Preoperative Clinic · EBAMG</div>
        ${step ? `<div class="step-indicator">${step}</div>` : ''}
        <h1>${title}</h1>
        ${sub ? `<p>${sub}</p>` : ''}
      </div>`;
  }
  renderBackBtn() {
    return `<button class="btn-back" onclick="window.app.goBack()">← Back</button>`;
  }
  renderIntro() {
    return `
      ${this.renderHeader('Perioperative Diabetes Medication Management Tool', 'Evidence-based perioperative instructions for all diabetes medications')}
      <div class="card">
        <div class="disclaimer">
          <strong>Clinical Disclaimer:</strong> This tool is a decision-support aid for qualified healthcare professionals only. It does not replace clinical judgment, institutional protocols, or direct patient assessment. All recommendations should be reviewed by the treating clinical team. Users assume full responsibility for clinical decisions made.
        </div>
        <p class="helper-text">Generates perioperative hold/continue/modify instructions for SGLT2 inhibitors, GLP-1 receptor agonists, DPP-4 inhibitors, metformin, sulfonylureas, thiazolidinediones, meglitinides, alpha-glucosidase inhibitors, and all insulin types including pumps.</p>
        <button class="btn-primary" onclick="window.app.setState('patient')">Begin Assessment →</button>

  renderPatient() {

    return `

  renderContext() {

        <span class="custom-radio"></span>
        <div><div>${label}</div>${subtitle ? `<div class="check-info">${subtitle}</div>` : ''}</div>

    };
    const yesno = (key, currentVal) => `
      <div class="btn-row">

    return `

        <div class="question">Diabetes Type</div>

        ${btn('Type 2 Diabetes (T2DM)', 'dmType', 'T2DM', ctx.dmType, 'Retains some endogenous insulin')}

        ${btn('Colonoscopy / endoscopy', 'surgeryType', 'colonoscopy', ctx.surgeryType)}
        ${btn('Major noncardiac surgery', 'surgeryType', 'majorNoncardiac', ctx.surgeryType, 'e.g., joint replacement, hysterectomy, bowel resection, major abdominal/pelvic, spine, or vascular surgery. Usually general anesthesia, longer fasting, often an overnight or multi-day stay.')}

  }
  validateContextAndContinue() {
    const ctx = this.state.context;

    }
    this.setState('medications');
  }
  renderMedications() {
    const selected = this.state.selected;
    const q = this.searchQuery.toLowerCase();
    const filterDrugs = (drugs) => q
      ? drugs.filter(d => d.name.toLowerCase().includes(q) || d.brand.toLowerCase().includes(q))
      : drugs;
    const drugItem = (drug) => {
      const isSelected = selected.has(drug.id);
      return `<div class="check-label drug-indent ${isSelected ? 'selected' : ''}" onclick="window.app.toggleDrug('${drug.id}')">
        <span class="custom-check">${isSelected ? '✓' : ''}</span>
        <div>
          <div>${drug.name}</div>
          <div class="check-info">${drug.brand}</div>
        </div>
      </div>`;
    };
    const section = (classKey) => {
      const cls = DRUG_DB[classKey];
      const drugs = filterDrugs(cls.drugs);
      if (!drugs.length) return '';
      return `<div class="category-header" data-cat="${classKey}"><span class="cat-chip"></span>${cls.label}</div>${drugs.map(drugItem).join('')}`;
    };
    const allSections = Object.keys(DRUG_DB).map(section).join('');
    return `
      ${this.renderHeader('Select Medications', 'Choose all diabetes medications this patient takes', 'Step 3 of 5')}
      ${this.renderBackBtn()}
      <div class="card">
        <div class="search-wrap">
          <span class="search-icon"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg></span>
          <input id="med-search" type="text" placeholder="Search medications..." value="${this.searchQuery.replace(/"/g,'&quot;')}" oninput="window.app.searchQuery=this.value;window.app.render({quiet:true})">
        </div>
        ${selected.size > 0 ? `<div class="selected-count">✓ ${selected.size} medication${selected.size > 1 ? 's' : ''} selected</div>` : ''}

  goToDetails() {

  renderDetails() {
    const sel = this.state.selected;

    const ctx = this.state.context;
    let html = '';
    // SGLT2i mode

              : '<strong>SPAQI (2026) — risk-stratified:</strong> Continue for minor procedures/colonoscopy (any patient); major noncardiac surgery (T2DM and non-diabetic); and cardiac surgery in non-diabetics and in T2DM with heart failure or CKD. Hold for type 1 diabetes; ketogenic/very-low-carb diet or bariatric surgery; and cardiac surgery in T2DM without heart failure or CKD. Any of the following forces a hold regardless of the above: anticipated >12 h without carbohydrate, expected surgery >3 h, current insulin use, history of DKA (including unknown), or most recent A1c >8% — the latter four are institutional criteria with no SPAQI recommendation number. Cardiac guidance is pending confirmation from cardiac surgery.'}
          </div>
          ${details.sglt2iMode === 'SPAQI' ? `
            <hr class="divider">
            <div class="question" style="font-size:14px;">Most recent A1c over 8%? <span style="font-size:12px;font-weight:400;color:var(--dim2)">Yes triggers a hold. Institutional criterion, not a SPAQI recommendation.</span></div>

            <div class="btn-row">

              <span class="units">units</span>
            </div>` : `
            <div class="section-label">Current ${drug.isNPH ? 'Dose' : (dd.dosingTime === 'morning' ? 'Morning Dose' : 'Evening Dose')}</div>
            <div class="dose-group">
              <label>${dd.dosingTime === 'morning' ? 'Morning dose' : 'Evening/bedtime dose'}</label>
              <input type="number" value="${dd.eveningDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','eveningDose',this.value)">
              <span class="units">units</span>
            </div>`}
        </div>`;
    });
    // Bolus insulins
    const bolusDrugs = getSelectedDrugsByClass(sel, 'bolusInsulin');
    bolusDrugs.forEach(drug => {
      const dd = details.insulinDetails[drug.id] || {};
      html += `
        <div class="card">
          <div class="question" style="font-size:15px;">${drug.name} <span style="color:var(--dim2);font-size:13px;">(${drug.brand})</span></div>
          <p class="helper-text">Prandial insulin — will be held while NPO. Enter current doses for patient instructions.</p>
          <div class="section-label">Breakfast Dose (units)</div>
          <div class="dose-group">
            <label>Breakfast</label>
            <input type="number" value="${dd.breakfastDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','breakfastDose',this.value)">
            <span class="units">units</span>
          </div>
          <div class="section-label">Lunch Dose (units)</div>
          <div class="dose-group">
            <label>Lunch</label>
            <input type="number" value="${dd.lunchDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','lunchDose',this.value)">
            <span class="units">units</span>
          </div>
          <div class="section-label">Dinner Dose (units)</div>
          <div class="dose-group">
            <label>Dinner</label>
            <input type="number" value="${dd.dinnerDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','dinnerDose',this.value)">
            <span class="units">units</span>
          </div>
        </div>`;
    });
    // Premixed insulins
    const premixDrugs = getSelectedDrugsByClass(sel, 'premixedInsulin');
    premixDrugs.forEach(drug => {
      const dd = details.insulinDetails[drug.id] || {};
      html += `
        <div class="card">
          <div class="question" style="font-size:15px;">${drug.name} <span style="color:var(--dim2);font-size:13px;">(${drug.brand})</span></div>
          <div class="section-label">Evening / Bedtime Dose</div>
          <div class="dose-group">
            <label>Evening dose</label>
            <input type="number" value="${dd.eveningDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','eveningDose',this.value)">
            <span class="units">units</span>
          </div>
          <div class="section-label">Morning Dose</div>
          <div class="dose-group">
            <label>Morning dose</label>
            <input type="number" value="${dd.morningDose || ''}" placeholder="units" min="0" oninput="window.app.updateInsulinDetailNoRender('${drug.id}','morningDose',this.value)">
            <span class="units">units</span>
          </div>
        </div>`;
    });
    return `
      ${this.renderHeader('Medication Details', 'Required for personalized instructions', 'Step 4 of 5')}
      ${this.renderBackBtn()}
      ${html}
      <button class="btn-primary" onclick="window.app.generateInstructions()">Generate Instructions →</button>`;
  }
  renderOutput() {
    const results = getAllResults(this.state.context, this.state.details, this.state.selected);
    const p = this.state.patient;
    const patientName = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Patient';
    return `
      ${this.renderHeader('Perioperative Medication Instructions', patientName + (p.dob ? ` · DOB: ${p.dob}` : ''), 'Step 5 of 5 — Results')}
      <div class="no-print">
        ${this.renderBackBtn()}
        <div class="tab-bar">
          <div class="tab ${this.outputTab==='clinician'?'active':''}" onclick="window.app.setOutputTab('clinician')">Clinician Summary</div>
          <div class="tab ${this.outputTab==='patient'?'active':''}" onclick="window.app.setOutputTab('patient')">Patient Sheet</div>
        </div>
      </div>
      <div id="clinician-tab" class="tab-content ${this.outputTab==='clinician'?'active':''} no-print">
        ${results.map(r => this.renderClinicianCard(r)).join('')}
        <div class="card" style="font-size:12px;color:var(--dim2);line-height:1.7;">
          <div style="font-weight:700;color:var(--accent);margin-bottom:8px;">ABSMC PERIOPERATIVE GLYCEMIC GOALS</div>
          <div>• Perioperative blood glucose target: <span class="mono-data">100–180 mg/dL</span> before, during and after surgery (ADA 2026, Rec 16.15, grade E)</div>
          <div>• Stricter targets are NOT recommended — increase hypoglycemia without improving outcomes (ADA 2026)</div>
          <div>• HbA1c alone is NOT a reason to postpone elective surgery (ADA 2026)</div>
          <div>• CGM should NOT be used alone for glucose monitoring during surgery (ADA 2026 S16, perioperative practice points; narrative, ungraded). A personal CGM may be continued in hospital where appropriate, with confirmatory point-of-care glucose for insulin dosing and hypoglycemia assessment, per institutional protocol (ADA 2026, Rec 16.6, grade B)</div>
          <div style="margin-top:8px;font-style:italic;">ABSMC Preoperative Clinic</div>
        </div>
        <div class="btn-row no-print" style="margin-top:8px;">
          <button class="btn-primary" onclick="window.app.startOver()">New Assessment</button>
        </div>
      </div>
      <div id="patient-tab" class="tab-content ${this.outputTab==='patient'?'active':''}">
        ${this.renderPatientSheet(results)}
        <div class="btn-row no-print" style="margin-top:12px;">
          <button class="btn-primary" onclick="window.app.printSheet()">Print</button>
          <button class="btn-primary" onclick="window.app.savePDF()">Save as PDF</button>
        </div>
        <div class="btn-row no-print" style="margin-top:8px;">
          <button onclick="window.app.startOver()">New Assessment</button>
        </div>
      </div>`;
  }
  renderProvenance(r) {
    const p = r.provenance;
    if (!p) return '';
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const rows = [];
    // 1. What the source recommended, with its R-number and which artifact it came from.
    if (p.rNumber) {
      rows.push(`<div><span class="prov-key">SPAQI</span> <span class="mono-data">${p.baseRecommendation}</span> &middot; <span class="mono-data">${p.rNumber}</span> <span class="prov-dim">(${p.rNumberSource})</span></div>`);
    } else {
      rows.push(`<div><span class="prov-key">SPAQI</span> <span class="prov-dim">does not cover type 1 diabetes. Held per FDA labeling, cited in the SPAQI Limitations section. No recommendation number, no evidence grade.</span></div>`);
    }
    // 2. Firing triggers, split by provenance: what the guideline held, and what
    //    ABSMC added on top. Each group renders only when non-empty.
    const srcT = p.sourceTriggers || [];
    const instT = p.institutionalTriggers || [];
    if (srcT.length > 0) {
      const items = srcT.map(t => {
        const rn = t.rNumber ? ` <span class="mono-data">${esc(t.rNumber)}</span>` : '';
        const nt = t.note ? ` <span class="prov-dim">(${esc(t.note)})</span>` : '';
        return `<strong>${esc(t.label)}</strong>${rn}${nt}`;
      }).join('; ');
      rows.push(`<div><span class="prov-key">Held per SPAQI</span> ${items}</div>`);
    }
    if (instT.length > 0) {
      const labels = instT.map(t => `<strong>${esc(t.label)}</strong>`).join(', ');
      const many = instT.length > 1;
      if (p.baseRecommendation === 'HOLD' || (p.sourceTriggers || []).length > 0) {
        // The hold is already source-recommended; these criteria are additional,
        // not the basis. Calling them the basis invites an override of a graded
        // recommendation to discontinue.
        rows.push(`<div><span class="prov-key">Also present</span> ${labels} <span class="prov-dim">(institutional ${many ? 'criteria' : 'criterion'}; the hold above is already source-recommended)</span></div>`);
      } else {
        rows.push(`<div class="prov-override"><span class="prov-key">Held on ABSMC criteria</span> ${labels}. ${many ? 'These are institutional criteria' : 'This is an institutional criterion'} with no SPAQI recommendation number.</div>`);
      }
    }
    // 3. Departure notice: only where the institution overrode a source CONTINUE
    //    and no source-backed trigger applied.
    if (p.sourceOverrideNotice) {
      rows.push(`<div class="prov-override"><span class="prov-key">Institutional override</span> SPAQI would continue here (${p.rNumber}). The hold above rests on institutional criteria alone.</div>`);
    }
    // Standing element of the clinician view per decision record section 7, shown
    // for every hold EXCEPT the fixed-hold limbs. T1DM is held per the FDA deferral
    // "irrespective of preoperative fasting and type of surgery" and SPAQI offers no
    // monitoring alternative there; ketogenic/bariatric is held for the diet itself.
    if (p.finalRecommendation === 'HOLD' && !p.isFixedHold) {
      rows.push(`<div class="prov-dim">Perioperative eDKA monitoring is an alternative to holding where monitoring capability exists.</div>`);
    }
    // 3. Timing departure on the T2DM keto/bariatric limb.
    if (p.timingDeparture) {
      rows.push(`<div class="prov-override"><span class="prov-key">Timing departure</span> R3b stops the drug at the start of the very-low-carbohydrate diet, potentially about two weeks preoperatively. ABSMC holds the same 72/96 h as any other SGLT2i hold, because the clinic cannot rely on seeing these patients before the diet begins.</div>`);
    }
    // 5. Note an unsupplied A1c so the omission is visible rather than silent.
    if (!p.a1cSupplied) {
      rows.push(`<div class="prov-dim">A1c was not supplied. An unavailable A1c does not trigger a hold.</div>`);
    }
    // 6. Box/Figure discrepancy footnote, shown wherever an affected R-number is
    //    printed -- as the base recommendation OR as a source-backed trigger.
    const affected = n => n === 'R3a' || n === 'R3b';
    // Two different Box-vs-Figure discrepancies, so two different footnotes.
    // Bariatric/VLCD (panel c) and cardiac T2DM without HF/CKD (panel d) print a
    // bare (R3) where the Box splits 3a and 3b.
    if (affected(p.rNumber)) {
      rows.push(`<div class="prov-dim">Note: Figure 2 prints a bare (R3) where the recommendation Box splits 3a and 3b. The Box governs here.</div>`);
    }
    // Major noncardiac fasting (panel b) prints (R4) in the T2DM column where the
    // Box assigns R3a and reserves R4 for patients without T2DM.
    if ((p.sourceTriggers || []).some(t => affected(t.rNumber))) {
      rows.push(`<div class="prov-dim">Note: Figure 2 panel b prints (R4) in the T2DM column for this limb, where the recommendation Box assigns R3a and reserves R4 for patients without T2DM. The Box governs here.</div>`);
    }
    return `<div class="provenance"><div class="result-section-label">Why this recommendation</div>${rows.join('')}</div>`;
  }
  renderClinicianCard(r) {
    const badgeHtml = `<span class="badge badge-${r.badgeType}">${r.badge}</span>`;
    const sectionHtml = (label, text) => text
      ? `<div class="result-section">
          <div class="result-section-label">${label}</div>
          <div class="result-section-text">${monoData(text)}</div>
         </div>` : '';
    const flagsHtml = r.flags.map(f => `<div class="flag flag-${f.type}"><div class="flag-label">${flagLabel(f.type)}</div>${f.text}</div>`).join('');
    const comboHtml = r.comboFlag ? `<div class="flag flag-warn"><div class="flag-label">Caution</div>${r.comboFlag}</div>` : '';
    return `
      <div class="result-card">
        <div class="result-card-header">
          ${badgeHtml}
          <h3>${r.drugClass}</h3>
          <div class="drug-list">${r.drugNames.join(' · ')}</div>
        </div>
        <div class="result-card-body">
          ${this.renderProvenance(r)}
          ${comboHtml}
          ${flagsHtml}
          ${sectionHtml('Days Before Surgery - Stop This Medication Early', r.clinician.daysBefore)}
          ${sectionHtml('Night Before Surgery', r.clinician.nightBefore)}
          ${sectionHtml('Morning of Surgery', r.clinician.morningOf)}
          ${sectionHtml('Dietary Instructions', r.clinician.dietary)}
          ${sectionHtml('Monitoring', r.clinician.monitoring)}
          ${sectionHtml('Resumption', r.clinician.resumption)}
          ${r.clinician.evidence ? `<div class="evidence-strip"><div class="evidence-label">Evidence</div>${linkifyGuidelines(r.clinician.evidence)}</div>` : ''}
        </div>
      </div>`;
  }
  renderPatientSheet(results) {
    const p = this.state.patient;
    const patientName = [p.firstName, p.lastName].filter(Boolean).join(' ') || '[Patient Name]';
    const ctx = this.state.context;
    const header = `
      <div class="patient-sheet-header">
        <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:8px;">ALTA BATES SUMMIT MEDICAL CENTER<br>PREOPERATIVE CLINIC</div>
        <h2>Diabetes Medication Instructions</h2>
        <div class="patient-meta">
          ${patientName}${p.dob ? ` · DOB: ${p.dob}` : ''}${p.arrivalTime ? ` · Arrival: ${fmtTime12(p.arrivalTime)}` : ''}<br>
          ${ctx.surgeryTiming === 'AM' ? 'AM Surgery' : 'PM Surgery'} · ${SURGERY_TYPE_LABELS[ctx.surgeryType] || ''}
        </div>
      </div>`;
    const cards = results.map(r => {
      const sec = (label, text, extra='') => text
        ? `<div class="patient-section">
            <div class="patient-section-label">${label}</div>
            <div class="patient-section-text">${monoData(text)}</div>
            ${extra}
           </div>` : '';
      const dietaryHtml = r.patient.dietary
        ? `<div class="patient-dietary">
            <div class="patient-dietary-label">Important Dietary Instruction</div>
            <div class="patient-section-text">${monoData(r.patient.dietary)}</div>
           </div>` : '';
      return `
        <div class="patient-drug-card">
          <div class="patient-drug-name">${r.drugClass}: ${r.drugNames.join(', ')}</div>
          ${sec('Days Before Surgery - Stop This Medication Early', r.patient.daysBefore)}
          ${sec('The Night Before Surgery', r.patient.nightBefore)}
          ${sec('The Morning of Surgery', r.patient.morningOf)}
          ${dietaryHtml}
        </div>`;
    }).join('');
    // Only the SGLT2i and GLP-1 cards carry eating and drinking rules. Everyone
    // else is pointed at the clinic's own instructions rather than being given a
    // second set that could contradict them.
    const hasDietGuidance = results.some(r => r.id === 'sglt2i' || r.id === 'glp1');
    const footer = `
      <div class="patient-footer">
        <div style="margin-bottom:6px;"><strong>Questions?</strong> Call the ABSMC Preoperative Clinic: <strong>(510) 869-8865</strong></div>
        ${hasDietGuidance ? '' : '<div style="margin-bottom:6px;"><strong>Eating and drinking:</strong> follow the instructions from the Preoperative Clinic.</div>'}
        <div style="margin-bottom:6px;">These instructions apply to your <strong>diabetes medications only</strong>.</div>
        <div style="margin-bottom:6px;"><strong>Important:</strong> These recommendations were generated based on information available at your preoperative visit. Please verify your arrival time with your surgeon's office, as surgery times can change. Check with your surgeon's office if you have questions about resuming your medications after surgery.</div>
        <div style="font-size:11px;color:var(--dim2);margin-top:8px;">Alta Bates Summit Medical Center Preoperative Clinic · Generated ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
      </div>`;
    return header + cards + footer;
  }
  printSheet() {
    this.outputTab = 'patient';
    this.render();
    setTimeout(() => window.print(), 100);
  }
  savePDF() {
    this.outputTab = 'patient';
    this.render();
    setTimeout(() => {
      alert('In the print dialog that opens, select "Save as PDF" as your destination (or "Print to PDF" on some devices).');
      window.print();
    }, 100);
  }
  startOver() {
    this.step = 'intro';
    this.outputTab = 'clinician';
    this.searchQuery = '';
    this.state = {
      patient: { firstName: '', lastName: '', dob: '', arrivalTime: '', surgeryDate: '' },
      context: { dmType: null, surgeryType: null, surgeryTiming: null, hasHF: null, hasCKD: null, arrivalTime: '', surgeryDate: '' },
      selected: new Set(),
      details: { sglt2iMode: 'SPAQI', a1cOver8: null, prolongedFasting: null, surgeryOver3h: null, sglt2iDoseTime: null, dkaHistory: null, ketoDiet: null, eGFR: '', contrastWithin48h: null, giSymptoms: null, glp1NpoCutoff: 'midnight', insulinDetails: {} },
    };
    this.render();
  }
  render({ quiet = false } = {}) {
    document.body.classList.toggle('no-selection-flash', quiet);
    let html = '';
    if (this.step === 'intro') html = this.renderIntro();
    else if (this.step === 'patient') html = this.renderPatient();
    else if (this.step === 'context') html = this.renderContext();
    else if (this.step === 'medications') html = this.renderMedications();
    else if (this.step === 'details') html = this.renderDetails();
    else if (this.step === 'output') html = this.renderOutput();
    const focusSearch = document.activeElement && document.activeElement.id === 'med-search';
    const caret = focusSearch ? document.activeElement.selectionStart : 0;
    document.getElementById('app').innerHTML = html;
    if (focusSearch) { const el = document.getElementById('med-search'); if (el) { el.focus(); el.setSelectionRange(caret, caret); } }
    if (this.step !== this.lastRenderedStep) window.scrollTo(0, 0);
    this.lastRenderedStep = this.step;
  }
}
window.app = new PerioperativeDMApp();
</script>
</body>
